<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101826">
<link rel="manifest" href="manifest.json">
<title>Operação · Cooperativa</title>
<link rel="stylesheet" href="styles.css">
<style>
  .stop-timeline{ padding:16px; border:1px solid var(--hair); border-radius:10px; margin-bottom:12px }
  .stop-line{ display:grid; grid-template-columns:60px 1fr auto; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--hair) }
  .stop-line:last-child{ border-bottom:none }
  .stop-label{ font-size:12px; font-weight:700; color:#6b7683; text-transform:uppercase; letter-spacing:.5px }
  .stop-name{ font-size:14px; font-weight:600; color:var(--text) }
  .stop-time{ display:flex; gap:12px; align-items:center }
  .time-box{ text-align:center }
  .time-val{ font-size:14px; font-weight:800; color:var(--text); font-family:monospace }
  .time-sub{ font-size:11px; color:#6b7683; text-transform:uppercase; letter-spacing:.5px; margin-top:2px }
  .status-chip{ display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:700 }
  .status-chip i{ width:8px; height:8px; border-radius:50%; display:inline-block }
  .chip-go i{ background:#25c968 }
  .chip-stop i{ background:#e81e1e }
  .chip-warn i{ background:#f5a400 }
  .chip-brand i{ background:#2a3f86 }
  .veic-card{ background:#f7f8fa; border-radius:12px; padding:16px; margin-bottom:16px }
  .veic-head{ display:grid; grid-template-columns:1fr auto; gap:12px; align-items:start; margin-bottom:12px; padding-bottom:12px; border-bottom:2px solid var(--hair) }
  .veic-info h3{ font-size:18px; font-weight:800; margin:0 0 4px 0; color:var(--text) }
  .veic-info div{ font-size:12px; color:#6b7683; margin:2px 0 }
  .veic-actions button{ margin-left:6px }
  .intervalo-edit{ display:flex; gap:8px; align-items:center; background:#fff; padding:12px 16px; border-radius:10px; border:1px solid var(--hair); margin-bottom:16px }
  .intervalo-edit input{ flex:0 0 60px; padding:6px 8px; border:1px solid var(--hair); border-radius:6px; text-align:center; font-weight:700 }
  .intervalo-edit button{ flex:0 0 auto }
  @media(max-width:768px){
    .stop-timeline{ padding:12px }
    .stop-line{ grid-template-columns:1fr; gap:8px }
    .stop-time{ flex-wrap:wrap }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <div><div class="eyebrow">Gestão de frotas</div><h1>Operação</h1></div>
    <div><input type="date" id="date" class="input" style="width:auto"></div>
  </div>

  <div class="intervalo-edit">
    <span style="flex:1"><b>Intervalo entre saídas:</b></span>
    <input type="number" id="intervaloVal" min="5" max="60" value="10">
    <span>min</span>
    <button class="btn" id="saveIntervalo">Salvar</button>
  </div>

  <div id="board"></div>
</div>

<script src="config.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
<script>
let DATE=T.today(), VEIC=[], PES=[], ROTA=null;

boot("operacao.html", async ()=>{
  renderTop("operacao.html");
  $("#date").value = DATE;
  $("#date").onchange = e => { DATE = e.target.value; refresh(); };
  $("#intervaloVal").value = COOP.INTERVALO_MIN;
  $("#saveIntervalo").onclick = salvarIntervalo;
  await load(); refresh();
});

async function load(){
  [VEIC, PES, ROTA] = await Promise.all([
    DB.all("veiculos"),
    DB.all("pessoas"),
    DB.get("rotas", COOP.ROTA_PADRAO)
  ]);
}

async function salvarIntervalo(){
  const novo = Number($("#intervaloVal").value);
  if(novo < 5 || novo > 60) return toast("Intervalo deve estar entre 5 e 60 min","stop");
  COOP.INTERVALO_MIN = novo;
  await FILA.reindex(DATE, (await FILA.get(DATE)), novo);
  toast("Intervalo atualizado para "+novo+" min","go");
  refresh();
}

async function refresh(){
  const fila = (await FILA.get(DATE)).sort((a,b) => a.filaPosicao - b.filaPosicao);
  const nowM = T.now();

  if(!fila.length || !ROTA){
    $("#board").innerHTML = `<div class="card"><div class="table-empty">Sem fila para ${DATE}. <button class="btn" onclick="(async()=>{ 
      const f=await FILA.build(T.today()); toast('Fila gerada','go'); location.reload(); 
    })()">Gerar fila</button></div></div>`;
    return;
  }

  let html = "";
  fila.forEach(f => {
    const v = vById(f.veiculoId);
    const mot = nameOf(PES, v.motoristaId);
    const prop = nameOf(PES, v.proprietarioId);

    let statusGeral = "aguardando";
    const todasCompletas = f.paradas.every(p => p.real);
    if(todasCompletas) statusGeral = "completo";
    else if(f.paradas.some(p => p.real)) statusGeral = "em_progresso";

    let statusChip = `<span class="status-chip chip-go"><i></i>No horário</span>`;
    if(statusGeral === "completo") statusChip = `<span class="status-chip chip-brand"><i></i>Completo</span>`;
    else if(statusGeral === "em_progresso") statusChip = `<span class="status-chip chip-warn"><i></i>Em progresso</span>`;

    html += `<div class="veic-card">
      <div class="veic-head">
        <div class="veic-info">
          <h3>${esc(v.prefixo)} · ${esc(v.modelo)}</h3>
          <div><b>${esc(mot)}</b> · Prop: ${esc(prop)}</div>
          <div>${esc(v.placa)}</div>
        </div>
        <div>${statusChip}</div>
      </div>
      <div class="stop-timeline">`;

    f.paradas.forEach(p => {
      const emAtraso = p.previsto && !p.real && T.toMin(p.previsto) < nowM - COOP.TOLERANCIA_MIN;
      let statusStop = "go";
      if(p.real) statusStop = "brand"; // já chegou
      else if(emAtraso) statusStop = "stop"; // atrasado

      html += `<div class="stop-line">
        <div>
          <div class="stop-label">Parada ${p.ordem}</div>
          <div class="stop-name">${esc(p.nome)}</div>
        </div>
        <div class="stop-time">
          <div class="time-box">
            <div class="time-val">${p.previsto}</div>
            <div class="time-sub">Previsto</div>
          </div>
          ${p.real ? `<div class="time-box">
            <div class="time-val">${p.real}</div>
            <div class="time-sub">Real</div>
          </div>` : ""}
          <span class="status-chip chip-${statusStop}"><i></i>${statusStop === "brand" ? "Registrado" : statusStop === "stop" ? "Atrasado" : "Aguardando"}</span>
        </div>
      </div>`;
    });

    html += `</div></div>`;
  });

  $("#board").innerHTML = html;
}

function vById(id){ return VEIC.find(v=>v.id===id)||{}; }
</script>
</body>
</html>
