<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101826">
<link rel="manifest" href="manifest.json">
<title>Fiscal · Cooperativa</title>
<link rel="stylesheet" href="styles.css">
<style>
  .seg-box{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px }
  .tab-btn{ padding:12px; border-radius:8px; border:2px solid var(--hair); background:#fff; cursor:pointer; font-weight:600; font-size:13px; transition:.2s }
  .tab-btn.active{ border-color:#2a3f86; background:#e8f0ff; color:#2a3f86 }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px }
  .form-col{ display:flex; flex-direction:column; gap:8px }
  @media(max-width:620px){ .form-grid, .seg-box{ grid-template-columns:1fr } }
</style>
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <div><div class="eyebrow">Gestão de paradas</div><h1>Fiscalização</h1></div>
    <div><input type="date" id="date" class="input" style="width:auto"></div>
  </div>

  <div class="seg">
    <button class="active" data-tab="registrar">Registrar</button>
    <button data-tab="historico">Histórico <i id="histN" style="margin-left:6px;font-weight:700"></i></button>
  </div>

  <!-- TAB: REGISTRAR -->
  <div id="registrar" class="tab active">
    <div class="card">
      <div class="card-h"><h3>Nova fiscalização</h3></div>
      <div class="card-b">
        <div class="form-grid">
          <div class="form-col">
            <label class="lbl">Parada</label>
            <select id="parada" class="input"></select>
          </div>
          <div class="form-col">
            <label class="lbl">Veículo / Prefixo</label>
            <select id="veiculo" class="input"><option value="">Escolha da fila</option></select>
          </div>
        </div>

        <div class="form-grid">
          <div class="form-col">
            <label class="lbl">Hora</label>
            <input type="time" id="hora" class="input" required>
          </div>
          <div class="form-col">
            <label class="lbl">Observação</label>
            <input type="text" id="obs" class="input" placeholder="Opcional">
          </div>
        </div>

        <div style="margin-bottom:16px">
          <label class="chk">
            <input type="checkbox" id="irregular">
            <span>Registrar irregularidade</span>
          </label>
          <div id="irregularOpt" style="display:none;margin-top:8px">
            <select id="irregTipo" class="input" style="font-size:13px">
              <option value="">Tipo de irregularidade</option>
              <option value="Excesso de passageiros">Excesso de passageiros</option>
              <option value="Documentação vencida">Documentação vencida</option>
              <option value="Limpeza do veículo">Limpeza do veículo</option>
              <option value="Falta de extintor">Falta de extintor</option>
              <option value="Pane no veículo">Pane no veículo</option>
              <option value="Atraso significativo">Atraso significativo</option>
              <option value="Comportamento do motorista">Comportamento do motorista</option>
              <option value="Outra">Outra</option>
            </select>
          </div>
        </div>

        <div style="margin-bottom:16px">
          <label class="lbl">Foto (opcional)</label>
          <input type="file" id="foto" class="input" accept="image/*">
          <div id="fotoPreview" style="margin-top:8px"></div>
        </div>

        <button class="btn" id="registrarBtn">Registrar</button>
      </div>
    </div>
  </div>

  <!-- TAB: HISTÓRICO -->
  <div id="historico" class="tab" style="display:none">
    <div class="card">
      <div class="card-h"><h3>Registros do dia</h3></div>
      <div class="card-b" id="histList"></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
<script>
let DATE=T.today(), VEIC=[], PES=[], ROTA=null, FILA=[];
let selVeic="", fotoData=null;

boot("fiscal.html", async ()=>{
  const user = getUser();
  const filtered = user && user.tipo === "Fiscal";

  $("#date").value = DATE;
  $("#date").onchange = e => { DATE = e.target.value; refresh(); };

  // Tabs
  $$(".seg button").forEach(b => b.onclick = ()=>{
    $$(".seg button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    $$(".tab").forEach(t => t.style.display="none");
    document.getElementById(b.dataset.tab).style.display="block";
  });

  // Hora default = agora
  const now = new Date();
  $("#hora").value = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");

  // Checkbox irregularidade
  $("#irregular").onchange = e => {
    $("#irregularOpt").style.display = e.target.checked ? "block" : "none";
  };

  // Upload de foto
  $("#foto").onchange = e => {
    const f = e.target.files[0];
    if(!f) { fotoData=null; $("#fotoPreview").innerHTML=""; return; }
    const r = new FileReader();
    r.onload = async ev => {
      let img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas");
        const ctx = c.getContext("2d");
        const maxW=720, maxH=720;
        let w=img.width, h=img.height;
        if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
        if(h>maxH){ w=Math.round(w*maxH/h); h=maxH; }
        c.width=w; c.height=h;
        ctx.drawImage(img,0,0,w,h);
        fotoData = c.toDataURL("image/jpeg",0.8);
        $("#fotoPreview").innerHTML = `<img src="${fotoData}" style="max-width:100%;border-radius:8px;max-height:240px">`;
      };
      img.src = ev.target.result;
    };
    r.readAsDataURL(f);
  };

  $("#registrarBtn").onclick = registrar;

  await load();
  refresh();
});

async function load(){
  [VEIC, PES, ROTA, FILA] = await Promise.all([
    DB.all("veiculos"),
    DB.all("pessoas"),
    DB.get("rotas", COOP.ROTA_PADRAO),
    FILA.get(DATE)
  ]);
}

async function refresh(){
  await load();

  // Paradas
  $("#parada").innerHTML = (ROTA?.paradas||[]).map(p=>
    `<option value="${p.id}">${p.ordem}. ${esc(p.nome)}</option>`
  ).join("");

  // Veículos da fila
  const veicOpts = FILA.map(f => {
    const v = VEIC.find(x=>x.id===f.veiculoId)||{};
    return `<option value="${f.veiculoId}">${esc(v.prefixo||"?")} · ${esc(nameOf(PES, v.motoristaId))}</option>`;
  }).join("");
  $("#veiculo").innerHTML = `<option value="">Escolha da fila</option>${veicOpts}`;

  paintHist();
}

async function registrar(){
  const parada = $("#parada").value;
  const veicId = $("#veiculo").value;
  const hora = $("#hora").value;
  if(!parada) return toast("Escolha a parada","stop");
  if(!hora) return toast("Defina a hora","stop");

  const v = VEIC.find(x=>x.id===veicId);
  if(!v) return toast("Escolha um veículo","stop");

  const reg = {
    id: DB.uid(),
    data: DATE,
    parada: parada,
    veiculoId: veicId,
    prefixo: v.prefixo,
    fiscalId: getUser()?.id || "",
    hora: hora,
    obs: $("#obs").value,
    irregular: $("#irregular").checked,
    irregTipo: $("#irregular").checked ? $("#irregTipo").value : "",
    foto: fotoData || "",
    ts: Date.now()
  };

  await DB.put("fiscalizacoes", reg);

  // Atualiza a fila com o registro na parada
  const filaRow = FILA.find(f => f.veiculoId === veicId);
  if(filaRow) {
    const paradaRow = filaRow.paradas.find(p => p.parada === parada);
    if(paradaRow) {
      paradaRow.real = hora;
      if(!paradaRow.registros) paradaRow.registros = [];
      paradaRow.registros.push(reg.id);
      await FILA.saveRow(DATE, filaRow);
    }
  }

  toast("Fiscalização registrada","go");
  $("#obs").value = ""; $("#hora").value = T.toHHMM(T.now()); $("#foto").value = "";
  fotoData = null; $("#fotoPreview").innerHTML = "";
  $("#irregular").checked = false; $("#irregularOpt").style.display = "none";
  refresh();
}

async function paintHist(){
  const user = getUser();
  let regs = (await DB.all("fiscalizacoes")).sort((a,b) => b.ts - a.ts);
  if(user && user.tipo === "Fiscal") regs = regs.filter(r => r.fiscalId === user.id);
  regs = regs.filter(r => r.data === DATE);

  $("#histN").innerHTML = `<i></i>${regs.length}`;
  $("#histList").innerHTML = regs.length ? regs.map(r => {
    const p = ROTA?.paradas?.find(x=>x.id===r.parada);
    return `<div class="hist-item">
      ${r.foto?`<img src="${r.foto}">`:`<div class="ph"></div>`}
      <div style="flex:1">
        <div><b>${esc(r.prefixo||"?")}</b> · <span class="num">${r.hora}</span>
          ${r.irregular?`<span class="chip stop" style="margin-left:6px"><i></i>${esc(r.irregTipo||"Irregular")}</span>`:""}</div>
        <div class="muted" style="font-size:13px">${esc(p?.nome||"?")} · ${esc(nameOf([...PES], r.fiscalId))} · ${(r.data||"").split("-").reverse().join("/")}</div>
        ${r.obs?`<div style="font-size:13px;margin-top:2px">${esc(r.obs)}</div>`:""}
      </div>
      <button class="btn ghost sm" data-del="${r.id}">×</button>
    </div>`;
  }).join("") : `<div class="table-empty">Nenhum registro para este dia.</div>`;

  $$("#histList [data-del]").forEach(b => b.onclick = async () => {
    await DB.del("fiscalizacoes", b.dataset.del);
    paintHist();
  });
}
</script>
</body>
</html>
