<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101826">
<link rel="manifest" href="manifest.json">
<title>Fiscal · Cooperativa</title>
<link rel="stylesheet" href="styles.css">
<style>
  .field-wrap{max-width:560px;margin:0 auto}
  .seg.full{display:flex;width:100%}
  .seg.full button{flex:1}
  .veic-chips{display:flex;flex-wrap:wrap;gap:8px}
  .vchip{border:1px solid var(--hair);background:#fff;border-radius:10px;padding:10px 14px;
    font-weight:800;font-size:16px;cursor:pointer;min-width:64px;text-align:center}
  .vchip.sel{background:var(--brand);color:#fff;border-color:var(--brand)}
  .vchip small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
  .vchip.sel small{color:#c9d3ee}
  .big-btn{width:100%;justify-content:center;font-size:16px;padding:15px}
  .toggle{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--hair);
    border-radius:10px;cursor:pointer;font-weight:700}
  .toggle.on{border-color:var(--stop);background:rgba(226,73,73,.06);color:#b52d2d}
  .sw{width:44px;height:26px;border-radius:20px;background:#cfd5df;position:relative;transition:.2s;flex:0 0 auto}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
    background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .toggle.on .sw{background:var(--stop)}.toggle.on .sw::after{left:21px}
  .photo-box{border:1px dashed var(--hair);border-radius:10px;padding:14px;text-align:center;color:var(--muted)}
  .photo-box img{max-width:100%;border-radius:8px;margin-top:8px}
  .hist-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f0f2f5}
  .hist-item:last-child{border-bottom:0}
  .hist-item img{width:54px;height:54px;object-fit:cover;border-radius:8px;flex:0 0 auto}
  .hist-item .ph{width:54px;height:54px;border-radius:8px;background:#eef0f4;flex:0 0 auto}
</style>
</head>
<body>
<div class="wrap field-wrap">
  <div class="page-head">
    <div><div class="eyebrow">Fiscalização</div><h1>App do fiscal</h1></div>
  </div>

  <div class="seg full mb" id="tabs">
    <button class="active" data-t="reg">Registrar</button>
    <button data-t="hist">Histórico</button>
    <button data-t="pts">Pontos</button>
  </div>

  <!-- REGISTRAR -->
  <div id="tab-reg">
    <div class="card"><div class="card-b">
      <div class="form-grid">
        <div class="field"><label>Fiscal</label><select id="fFiscal"></select></div>
        <div class="field"><label>Ponto de fiscalização</label><select id="fPonto"></select></div>
      </div>

      <div class="field">
        <label>Veículo que passou</label>
        <div class="veic-chips" id="vchips"></div>
        <input class="input mt" id="vManual" placeholder="ou digite o prefixo (fora da fila)">
      </div>

      <div class="form-grid">
        <div class="field"><label>Horário</label><input type="time" class="input" id="fHora"></div>
        <div class="field"><label>Data</label><input type="date" class="input" id="fData"></div>
      </div>

      <div class="field"><label>Observações</label>
        <textarea id="fObs" rows="2" placeholder="Opcional"></textarea></div>

      <div class="field">
        <div class="toggle" id="fIrreg"><div class="sw"></div><span>Registrar irregularidade</span></div>
        <div id="irregBox" style="display:none" class="mt">
          <select id="fIrregTipo"></select>
        </div>
      </div>

      <div class="field"><label>Foto (opcional)</label>
        <div class="photo-box" id="photoBox">
          <input type="file" accept="image/*" capture="environment" id="fFoto" style="display:none">
          <button class="btn ghost sm" id="btnFoto">📷 Tirar / anexar foto</button>
          <div id="photoPrev"></div>
        </div>
      </div>

      <button class="btn big-btn" id="btnReg">Registrar passagem</button>
    </div></div>
  </div>

  <!-- HISTÓRICO -->
  <div id="tab-hist" style="display:none">
    <div class="card"><div class="card-h"><h3>Registros</h3><span class="chip mut" id="histN"><i></i>0</span></div>
      <div class="card-b" id="histList"></div></div>
  </div>

  <!-- PONTOS -->
  <div id="tab-pts" style="display:none">
    <div class="card"><div class="card-b">
      <div class="field"><label>Novo ponto</label>
        <div class="btn-row"><input class="input" id="ptNome" placeholder="Ex.: Trevo de Candeias">
          <button class="btn" id="ptAdd">Adicionar</button></div></div>
      <div id="ptList" class="mt"></div>
    </div></div>
  </div>
</div>

<script src="config.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
<script>
let PES=[], VEIC=[], PONTOS=[], selVeic=null, foto="";
const K_FISCAL=COOP.COL+"lastFiscal", K_PONTO=COOP.COL+"lastPonto";

boot("fiscal.html", async ()=>{
  $("#fData").value=T.today();
  $("#fHora").value=T.toHHMM(T.now());
  fillSel($("#fIrregTipo"), ["Atraso","Excesso de passageiros","Sem uniforme","Documentação","Fora da rota","Outra"]);

  $$("#tabs button").forEach(b=>b.onclick=()=>{
    $$("#tabs button").forEach(x=>x.classList.remove("active")); b.classList.add("active");
    ["reg","hist","pts"].forEach(t=>$("#tab-"+t).style.display = t===b.dataset.t?"":"none");
    if(b.dataset.t==="hist") paintHist();
    if(b.dataset.t==="pts") paintPontos();
  });

  $("#fIrreg").onclick=()=>{ $("#fIrreg").classList.toggle("on");
    $("#irregBox").style.display=$("#fIrreg").classList.contains("on")?"":"none"; };

  $("#btnFoto").onclick=()=>$("#fFoto").click();
  $("#fFoto").onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
    foto=await shrink(f); $("#photoPrev").innerHTML=`<img src="${foto}">`; };

  $("#vManual").oninput=()=>{ if($("#vManual").value){ selVeic=null; $$("#vchips .vchip").forEach(c=>c.classList.remove("sel")); } };

  $("#ptAdd").onclick=addPonto;
  $("#btnReg").onclick=registrar;

  await load();
  fillPeople($("#fFiscal"), PES.filter(p=>p.tipo==="Fiscal"));
  if(localStorage.getItem(K_FISCAL)) $("#fFiscal").value=localStorage.getItem(K_FISCAL);
  paintPontosSelect();
  await paintVeicChips();
});

function fillSel(sel,arr){ sel.innerHTML=arr.map(x=>`<option>${x}</option>`).join(""); }
function fillPeople(sel,list){ sel.innerHTML=list.length?list.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join(""):`<option value="">— cadastre um fiscal —</option>`; }
function vById(id){ return VEIC.find(v=>v.id===id)||{}; }

async function load(){
  [PES,VEIC,PONTOS]=await Promise.all([DB.all("pessoas"),DB.all("veiculos"),DB.all("pontos")]);
  if(!PONTOS.length){ // semeia pontos padrão na primeira vez
    for(const n of ["Saída — Candeias","Trevo (meio da rota)","Chegada — Madre de Deus"]) await DB.put("pontos",{nome:n});
    PONTOS=await DB.all("pontos");
  }
}

function paintPontosSelect(){
  $("#fPonto").innerHTML=PONTOS.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join("");
  if(localStorage.getItem(K_PONTO)) $("#fPonto").value=localStorage.getItem(K_PONTO);
}

async function paintVeicChips(){
  const fila=(await FILA.get(T.today())).sort((a,b)=>a.ordem-b.ordem);
  const el=$("#vchips");
  if(!fila.length){ el.innerHTML=`<span class="muted" style="font-size:13px">Sem fila hoje — digite o prefixo abaixo.</span>`; return; }
  el.innerHTML=fila.map(f=>{ const v=vById(f.veiculoId);
    return `<div class="vchip" data-v="${f.veiculoId}">${esc(v.prefixo||"?")}<small>${f.previsto}</small></div>`; }).join("");
  $$("#vchips .vchip").forEach(c=>c.onclick=()=>{
    $$("#vchips .vchip").forEach(x=>x.classList.remove("sel")); c.classList.add("sel");
    selVeic=c.dataset.v; $("#vManual").value="";
  });
}

async function registrar(){
  const fiscalId=$("#fFiscal").value;
  if(!fiscalId) return toast("Selecione o fiscal","stop");
  const prefixoManual=$("#vManual").value.trim();
  if(!selVeic && !prefixoManual) return toast("Escolha ou digite o veículo","stop");
  localStorage.setItem(K_FISCAL,fiscalId); localStorage.setItem(K_PONTO,$("#fPonto").value);

  await DB.put("fiscalizacoes",{
    pontoId:$("#fPonto").value, fiscalId,
    veiculoId:selVeic||"", prefixo:selVeic?vById(selVeic).prefixo:prefixoManual,
    data:$("#fData").value, hora:$("#fHora").value, obs:$("#fObs").value,
    irregular:$("#fIrreg").classList.contains("on"),
    irregTipo:$("#fIrreg").classList.contains("on")?$("#fIrregTipo").value:"",
    foto, ts:Date.now()
  });
  // reset leve
  $("#fObs").value=""; foto=""; $("#photoPrev").innerHTML=""; $("#vManual").value="";
  $("#fIrreg").classList.remove("on"); $("#irregBox").style.display="none";
  selVeic=null; $$("#vchips .vchip").forEach(c=>c.classList.remove("sel"));
  $("#fHora").value=T.toHHMM(T.now());
  toast("Passagem registrada","go");
}

async function paintHist(){
  const regs=(await DB.all("fiscalizacoes")).sort((a,b)=>b.ts-a.ts);
  $("#histN").innerHTML=`<i></i>${regs.length}`;
  $("#histList").innerHTML = regs.length ? regs.map(r=>{
    const ponto=PONTOS.find(p=>p.id===r.pontoId)?.nome||"—";
    return `<div class="hist-item">
      ${r.foto?`<img src="${r.foto}">`:`<div class="ph"></div>`}
      <div style="flex:1">
        <div><b>${esc(r.prefixo||"?")}</b> · <span class="num">${r.hora}</span>
          ${r.irregular?`<span class="chip stop" style="margin-left:6px"><i></i>${esc(r.irregTipo||"Irregular")}</span>`:""}</div>
        <div class="muted" style="font-size:13px">${esc(ponto)} · ${esc(nameOf(PES,r.fiscalId))} · ${(r.data||"").split("-").reverse().join("/")}</div>
        ${r.obs?`<div style="font-size:13px;margin-top:2px">${esc(r.obs)}</div>`:""}
      </div>
      <button class="btn ghost sm" data-del="${r.id}">×</button>
    </div>`;
  }).join("") : `<div class="table-empty">Nenhum registro ainda.</div>`;
  $$("#histList [data-del]").forEach(b=>b.onclick=async()=>{ await DB.del("fiscalizacoes",b.dataset.del); paintHist(); });
}

async function addPonto(){
  const n=$("#ptNome").value.trim(); if(!n) return toast("Informe o nome do ponto","stop");
  await DB.put("pontos",{nome:n}); $("#ptNome").value="";
  PONTOS=await DB.all("pontos"); paintPontos(); paintPontosSelect(); toast("Ponto adicionado","go");
}
function paintPontos(){
  $("#ptList").innerHTML = PONTOS.length ? PONTOS.map(p=>`
    <div class="list-row"><span>📍 ${esc(p.nome)}</span>
      <button class="btn ghost sm" data-dp="${p.id}">Excluir</button></div>`).join("")
    : `<div class="table-empty">Nenhum ponto cadastrado.</div>`;
  $$("#ptList [data-dp]").forEach(b=>b.onclick=async()=>{ await DB.del("pontos",b.dataset.dp);
    PONTOS=await DB.all("pontos"); paintPontos(); paintPontosSelect(); });
}

// reduz a foto para caber no armazenamento (thumb ~720px, jpeg)
function shrink(file){
  return new Promise(res=>{
    const img=new Image(), r=new FileReader();
    r.onload=()=>{ img.onload=()=>{
      const max=720, sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=img.width*sc; c.height=img.height*sc;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",0.6));
    }; img.src=r.result; };
    r.readAsDataURL(file);
  });
}
</script>
</body>
</html>
