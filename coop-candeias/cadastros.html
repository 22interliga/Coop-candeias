<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101826">
<link rel="manifest" href="manifest.json">
<title>Cadastros · Cooperativa</title>
<link rel="stylesheet" href="styles.css">
<style>
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px }
  .form-col{ display:flex; flex-direction:column; gap:6px }
  .lbl{ font-size:12px; font-weight:700; color:#6b7683; text-transform:uppercase; letter-spacing:.5px }
  .paradas-list{ border:1px solid var(--hair); border-radius:10px; overflow:hidden }
  .parada-row{ display:grid; grid-template-columns:40px 1fr 40px; gap:8px; align-items:center; padding:12px; border-bottom:1px solid var(--hair); background:#f7f8fa }
  .parada-row:last-child{ border-bottom:none }
  .parada-row input{ padding:8px 10px; border:1px solid var(--hair); border-radius:6px; font-size:13px }
  .parada-row button{ padding:4px 8px; }
  @media(max-width:768px){ .form-grid{ grid-template-columns:1fr } }
</style>
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <div><div class="eyebrow">Configuração</div><h1>Cadastros</h1></div>
  </div>

  <div class="seg">
    <button class="active" data-tab="veiculos">Veículos</button>
    <button data-tab="pessoas">Pessoas</button>
    <button data-tab="rotas">Rotas</button>
    <button data-tab="cooperativa">Cooperativa</button>
  </div>

  <!-- VEÍCULOS -->
  <div id="veiculos" class="tab active">
    <div class="card">
      <div class="card-h"><h3>Veículos ativos</h3>
        <button class="btn" id="addVeic">+ Novo</button>
      </div>
      <div class="card-b" id="veicList"></div>
    </div>
  </div>

  <!-- PESSOAS -->
  <div id="pessoas" class="tab" style="display:none">
    <div class="card">
      <div class="card-h"><h3>Pessoas</h3>
        <button class="btn" id="addPes">+ Novo</button>
      </div>
      <div class="card-b" id="pesList"></div>
    </div>
  </div>

  <!-- ROTAS -->
  <div id="rotas" class="tab" style="display:none">
    <div class="card">
      <div class="card-h"><h3>Rotas de transporte</h3>
        <button class="btn" id="addRota">+ Novo</button>
      </div>
      <div class="card-b" id="rotaList"></div>
    </div>
  </div>

  <!-- COOPERATIVA -->
  <div id="cooperativa" class="tab" style="display:none">
    <div class="card">
      <div class="card-h"><h3>Informações da cooperativa</h3></div>
      <div class="card-b">
        <div class="form-grid">
          <div class="form-col">
            <label class="lbl">Nome</label>
            <input type="text" id="coopNome" class="input">
          </div>
          <div class="form-col">
            <label class="lbl">CNPJ</label>
            <input type="text" id="coopCNPJ" class="input" placeholder="00.000.000/0000-00">
          </div>
        </div>
        <div class="form-grid">
          <div class="form-col">
            <label class="lbl">Rota principal</label>
            <input type="text" id="coopRota" class="input" placeholder="Origem → Destino">
          </div>
          <div class="form-col">
            <label class="lbl">Presidente</label>
            <select id="coopPres" class="input"></select>
          </div>
        </div>
        <button class="btn" id="saveCoop">Salvar alterações</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: Editar veículo -->
<div id="modalVeic" class="modal" style="display:none">
  <div class="modal-content">
    <button class="modal-close" id="closeVeic">×</button>
    <h2>Editar veículo</h2>
    <div class="form-grid">
      <div class="form-col">
        <label class="lbl">Prefixo</label>
        <input type="text" id="vmPrefixo" class="input">
      </div>
      <div class="form-col">
        <label class="lbl">Placa</label>
        <input type="text" id="vmPlaca" class="input">
      </div>
      <div class="form-col">
        <label class="lbl">Modelo</label>
        <input type="text" id="vmModelo" class="input">
      </div>
      <div class="form-col">
        <label class="lbl">Marca</label>
        <input type="text" id="vmMarca" class="input">
      </div>
      <div class="form-col">
        <label class="lbl">Ano</label>
        <input type="number" id="vmAno" class="input" min="2000" max="2050">
      </div>
      <div class="form-col">
        <label class="lbl">Capacidade (passageiros)</label>
        <input type="number" id="vmCap" class="input" min="1" max="50">
      </div>
      <div class="form-col">
        <label class="lbl">Proprietário</label>
        <select id="vmProp" class="input"></select>
      </div>
      <div class="form-col">
        <label class="lbl">Motorista</label>
        <select id="vmMot" class="input"></select>
      </div>
      <div class="form-col">
        <label class="lbl">Cobrador</label>
        <select id="vmCob" class="input"></select>
      </div>
      <div class="form-col">
        <label class="lbl">Situação</label>
        <select id="vmSit" class="input">
          <option value="Ativo">Ativo</option>
          <option value="Manutenção">Manutenção</option>
          <option value="Suspenso">Suspenso</option>
          <option value="Inativo">Inativo</option>
        </select>
      </div>
      <div class="form-col">
        <label class="lbl">Documentação</label>
        <input type="text" id="vmDoc" class="input" placeholder="OK ou vencida">
      </div>
    </div>
    <div style="margin-bottom:16px">
      <label class="lbl">Dias de escala</label>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px">
        ${COOP.DIAS.map((d,i)=>`<label class="chk"><input type="checkbox" class="dia-check" value="${i}"> ${d}</label>`).join("")}
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" id="saveVeic">Salvar</button>
      <button class="btn ghost" id="delVeic">Excluir</button>
    </div>
  </div>
</div>

<!-- MODAL: Editar pessoa -->
<div id="modalPes" class="modal" style="display:none">
  <div class="modal-content">
    <button class="modal-close" id="closePes">×</button>
    <h2>Editar pessoa</h2>
    <div class="form-grid">
      <div class="form-col">
        <label class="lbl">Nome</label>
        <input type="text" id="pmNome" class="input">
      </div>
      <div class="form-col">
        <label class="lbl">Tipo</label>
        <select id="pmTipo" class="input">
          ${COOP.TIPOS_PESSOA.map(t=>`<option value="${t}">${t}</option>`).join("")}
        </select>
      </div>
      <div class="form-col">
        <label class="lbl">Telefone</label>
        <input type="tel" id="pmTel" class="input">
      </div>
      <div class="form-col">
        <label class="lbl">Documento</label>
        <input type="text" id="pmDoc" class="input" placeholder="CPF/RG">
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" id="savePes">Salvar</button>
      <button class="btn ghost" id="delPes">Excluir</button>
    </div>
  </div>
</div>

<!-- MODAL: Editar rota -->
<div id="modalRota" class="modal" style="display:none">
  <div class="modal-content">
    <button class="modal-close" id="closeRota">×</button>
    <h2>Editar rota</h2>
    <div class="form-grid">
      <div class="form-col">
        <label class="lbl">Nome da rota</label>
        <input type="text" id="rmNome" class="input" placeholder="Ex: Candeias → Madre de Deus">
      </div>
      <div class="form-col">
        <label class="lbl">Origem</label>
        <input type="text" id="rmOrig" class="input">
      </div>
      <div class="form-col">
        <label class="lbl">Destino</label>
        <input type="text" id="rmDest" class="input">
      </div>
    </div>
    <div style="margin-bottom:16px">
      <label class="lbl">Paradas do percurso</label>
      <div class="paradas-list" id="rmParadas"></div>
      <button class="btn ghost" id="addParada" style="margin-top:8px;width:100%">+ Adicionar parada</button>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" id="saveRota">Salvar</button>
      <button class="btn ghost" id="delRota">Excluir</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
<script>
let VEIC=[], PES=[], ROTAS=[], COOP_DATA={};
let currentVeic=null, currentPes=null, currentRota=null;

boot("cadastros.html", async ()=>{
  // Tabs
  $$(".seg button").forEach(b => b.onclick = ()=>{
    $$(".seg button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    $$(".tab").forEach(t => t.style.display="none");
    document.getElementById(b.dataset.tab).style.display="block";
  });

  // Botões veículos
  $("#addVeic").onclick = () => { currentVeic=null; openModalVeic({}); };
  $("#closeVeic").onclick = () => $("#modalVeic").style.display="none";
  $("#saveVeic").onclick = saveVeic;
  $("#delVeic").onclick = delVeic;

  // Botões pessoas
  $("#addPes").onclick = () => { currentPes=null; openModalPes({}); };
  $("#closePes").onclick = () => $("#modalPes").style.display="none";
  $("#savePes").onclick = savePes;
  $("#delPes").onclick = delPes;

  // Botões rotas
  $("#addRota").onclick = () => { currentRota=null; openModalRota({}); };
  $("#closeRota").onclick = () => $("#modalRota").style.display="none";
  $("#saveRota").onclick = saveRota;
  $("#delRota").onclick = delRota;
  $("#addParada").onclick = addParadaField;

  // Botão cooperativa
  $("#saveCoop").onclick = saveCoop;

  await load();
  paintAll();
});

async function load(){
  [VEIC, PES, ROTAS, COOP_DATA] = await Promise.all([
    DB.all("veiculos"),
    DB.all("pessoas"),
    DB.all("rotas"),
    DB.get("cooperativa", "coop")
  ]);
  COOP_DATA = COOP_DATA || { id:"coop", nome:COOP.COOPERATIVA, cnpj:"", rota:COOP.ROTA, presidente:"" };
}

async function paintAll(){
  // Veículos
  $("#veicList").innerHTML = VEIC.length ? VEIC.map(v=>`<div class="table-row" onclick="openModalVeic('${v.id}')">
    <b>${esc(v.prefixo)}</b><span class="muted">${esc(v.placa)} · ${esc(v.modelo)}</span>
  </div>`).join("") : `<div class="table-empty">Nenhum veículo cadastrado.</div>`;

  // Pessoas
  $("#pesList").innerHTML = PES.length ? PES.map(p=>`<div class="table-row" onclick="openModalPes('${p.id}')">
    <b>${esc(p.nome)}</b><span class="muted">${p.tipo} · ${esc(p.telefone)}</span>
  </div>`).join("") : `<div class="table-empty">Nenhuma pessoa cadastrada.</div>`;

  // Rotas
  $("#rotaList").innerHTML = ROTAS.length ? ROTAS.map(r=>`<div class="table-row" onclick="openModalRota('${r.id}')">
    <b>${esc(r.nome)}</b><span class="muted">${r.paradas?.length||0} paradas</span>
  </div>`).join("") : `<div class="table-empty">Nenhuma rota cadastrada.</div>`;

  // Cooperativa
  $("#coopNome").value = COOP_DATA.nome || "";
  $("#coopCNPJ").value = COOP_DATA.cnpj || "";
  $("#coopRota").value = COOP_DATA.rota || "";
  $("#coopPres").innerHTML = `<option value="">Ninguém</option>${PES.filter(p=>p.tipo==="Presidente").map(p=>`<option value="${p.id}" ${COOP_DATA.presidente===p.id?"selected":""}>${esc(p.nome)}</option>`).join("")}`;
}

function openModalVeic(id){
  currentVeic = id === "" ? null : VEIC.find(v=>v.id===id);
  if(!currentVeic) currentVeic = {};
  
  $("#vmPrefixo").value = currentVeic.prefixo || "";
  $("#vmPlaca").value = currentVeic.placa || "";
  $("#vmModelo").value = currentVeic.modelo || "";
  $("#vmMarca").value = currentVeic.marca || "";
  $("#vmAno").value = currentVeic.ano || new Date().getFullYear();
  $("#vmCap").value = currentVeic.capacidade || 8;
  $("#vmDoc").value = currentVeic.documentacao || "OK";
  $("#vmSit").value = currentVeic.situacao || "Ativo";
  
  $("#vmProp").innerHTML = `<option value="">Ninguém</option>${PES.filter(p=>p.tipo==="Proprietário").map(p=>`<option value="${p.id}" ${currentVeic.proprietarioId===p.id?"selected":""}>${esc(p.nome)}</option>`).join("")}`;
  $("#vmMot").innerHTML = `<option value="">Ninguém</option>${PES.filter(p=>p.tipo==="Motorista").map(p=>`<option value="${p.id}" ${currentVeic.motoristaId===p.id?"selected":""}>${esc(p.nome)}</option>`).join("")}`;
  $("#vmCob").innerHTML = `<option value="">Ninguém</option>${PES.filter(p=>p.tipo==="Motorista").map(p=>`<option value="${p.id}" ${currentVeic.cobradorId===p.id?"selected":""}>${esc(p.nome)}</option>`).join("")}`;
  
  $$(".dia-check").forEach(c => c.checked = (currentVeic.escalaDias||[]).includes(Number(c.value)));
  $("#modalVeic").style.display="block";
}

async function saveVeic(){
  const v = {
    id: currentVeic?.id || DB.uid(),
    prefixo: $("#vmPrefixo").value,
    placa: $("#vmPlaca").value,
    modelo: $("#vmModelo").value,
    marca: $("#vmMarca").value,
    ano: Number($("#vmAno").value),
    capacidade: Number($("#vmCap").value),
    proprietarioId: $("#vmProp").value,
    motoristaId: $("#vmMot").value,
    cobradorId: $("#vmCob").value,
    situacao: $("#vmSit").value,
    documentacao: $("#vmDoc").value,
    escalaDias: [...$$(".dia-check:checked")].map(c=>Number(c.value)),
    ordemBase: currentVeic?.ordemBase || VEIC.length+1
  };
  await DB.put("veiculos", v);
  toast("Veículo salvo","go");
  $("#modalVeic").style.display="none";
  await load(); paintAll();
}

async function delVeic(){
  if(!currentVeic?.id) return;
  if(!confirm("Excluir este veículo?")) return;
  await DB.del("veiculos", currentVeic.id);
  toast("Veículo excluído","go");
  $("#modalVeic").style.display="none";
  await load(); paintAll();
}

function openModalPes(id){
  currentPes = id === "" ? null : PES.find(p=>p.id===id);
  if(!currentPes) currentPes = {};
  
  $("#pmNome").value = currentPes.nome || "";
  $("#pmTipo").value = currentPes.tipo || "Motorista";
  $("#pmTel").value = currentPes.telefone || "";
  $("#pmDoc").value = currentPes.doc || "";
  $("#modalPes").style.display="block";
}

async function savePes(){
  const p = {
    id: currentPes?.id || DB.uid(),
    nome: $("#pmNome").value,
    tipo: $("#pmTipo").value,
    telefone: $("#pmTel").value,
    doc: $("#pmDoc").value,
    situacao: "Ativo"
  };
  if(!p.nome) return toast("Nome é obrigatório","stop");
  await DB.put("pessoas", p);
  toast("Pessoa salva","go");
  $("#modalPes").style.display="none";
  await load(); paintAll();
}

async function delPes(){
  if(!currentPes?.id) return;
  if(!confirm("Excluir esta pessoa?")) return;
  await DB.del("pessoas", currentPes.id);
  toast("Pessoa excluída","go");
  $("#modalPes").style.display="none";
  await load(); paintAll();
}

function openModalRota(id){
  currentRota = id === "" ? null : ROTAS.find(r=>r.id===id);
  if(!currentRota) currentRota = { paradas:[] };
  
  $("#rmNome").value = currentRota.nome || "";
  $("#rmOrig").value = currentRota.origem || "";
  $("#rmDest").value = currentRota.destino || "";
  paintParadas();
  $("#modalRota").style.display="block";
}

function paintParadas(){
  $("#rmParadas").innerHTML = (currentRota.paradas||[]).map((p,i)=>`<div class="parada-row">
    <span style="text-align:center;font-weight:700">${i+1}</span>
    <input type="text" value="${esc(p.nome)}" placeholder="Nome da parada" onchange="currentRota.paradas[${i}].nome=this.value">
    <button class="btn ghost sm" onclick="currentRota.paradas.splice(${i},1);paintParadas()">×</button>
  </div>`).join("");
}

function addParadaField(){
  if(!currentRota.paradas) currentRota.paradas = [];
  currentRota.paradas.push({ id:DB.uid(), nome:"Nova parada", ordem:currentRota.paradas.length+1 });
  paintParadas();
}

async function saveRota(){
  const r = {
    id: currentRota?.id || DB.uid(),
    nome: $("#rmNome").value,
    origem: $("#rmOrig").value,
    destino: $("#rmDest").value,
    paradas: (currentRota.paradas||[]).map((p,i)=>({ ...p, ordem:i+1 }))
  };
  if(!r.nome) return toast("Nome da rota é obrigatório","stop");
  if(!r.paradas.length) return toast("Adicione pelo menos uma parada","stop");
  await DB.put("rotas", r);
  toast("Rota salva","go");
  $("#modalRota").style.display="none";
  await load(); paintAll();
}

async function delRota(){
  if(!currentRota?.id) return;
  if(!confirm("Excluir esta rota?")) return;
  await DB.del("rotas", currentRota.id);
  toast("Rota excluída","go");
  $("#modalRota").style.display="none";
  await load(); paintAll();
}

async function saveCoop(){
  const c = {
    id: "coop",
    nome: $("#coopNome").value,
    cnpj: $("#coopCNPJ").value,
    rota: $("#coopRota").value,
    presidente: $("#coopPres").value,
    caixa: COOP_DATA.caixa || 0
  };
  await DB.put("cooperativa", c);
  toast("Cooperativa atualizada","go");
  await load(); paintAll();
}
</script>
</body>
</html>
