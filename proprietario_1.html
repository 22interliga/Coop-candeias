<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101826">
<link rel="manifest" href="manifest.json">
<title>Proprietário · Cooperativa</title>
<link rel="stylesheet" href="styles.css">
<style>
  .wa{background:#25d366;color:#062e16;border-color:#25d366}
  .wa:hover{filter:brightness(1.05)}
</style>
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <div><div class="eyebrow">Meu painel</div><h1>Proprietário</h1></div>
  </div>

  <div class="grid g-2 mb" id="kpis"></div>

  <div class="grid" style="gap:16px">
    <div class="card">
      <div class="card-h"><h3>Meus veículos</h3></div>
      <div class="card-b" id="veiculos"></div>
    </div>

    <div class="card">
      <div class="card-h"><h3>Minhas cobranças</h3>
        <div class="seg">
          <button class="active" data-f="all">Todas</button>
          <button data-f="open">Em aberto</button>
          <button data-f="paid">Quitadas</button>
        </div>
      </div>
      <div class="card-b" id="cobrancas"></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
<script>
let FILT="all";

boot("proprietario.html", async ()=>{
  requireLogin();
  const user = getUser();
  if(user.tipo !== "Proprietário") { toast("Acesso apenas para proprietários","stop"); logout(); return; }

  const [veics, cobs, pens, pessoas] = await Promise.all([
    DB.all("veiculos"),
    DB.all("cobrancas"),
    DB.all("penalidades"),
    DB.all("pessoas")
  ]);

  const meus = veics.filter(v => v.proprietarioId === user.id);
  const minhasCobs = cobs.filter(c => c.cooperadoId === user.id);

  // Filtro de cobranças
  $$(".seg button").forEach(b => b.onclick = ()=>{
    $$(".seg button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    FILT = b.dataset.f;
    paintCobs();
  });

  // KPIs
  const abertas = minhasCobs.filter(c => c.situacao === "Aberto").reduce((s,c)=>s+Number(c.valor||0),0);
  const quitadas = minhasCobs.filter(c => c.situacao === "Quitado").reduce((s,c)=>s+Number(c.valor||0),0);
  const kpi = (k,v,sub) => `<div class="card stat"><div class="k">${k}</div><div class="v small">${v}</div><div class="sub">${sub||""}</div></div>`;
  $("#kpis").innerHTML = 
    kpi("Cobranças em aberto", money(abertas), minhasCobs.filter(c=>c.situacao==="Aberto").length + " cobrança(s)") +
    kpi("Total quitado", money(quitadas), "");

  // Veículos
  $("#veiculos").innerHTML = meus.length 
    ? meus.map(v => {
      const mot = nameOf(pessoas, v.motoristaId);
      const pEnv = pens.filter(p => p.veiculoId === v.id).length;
      return `<div style="padding:12px;border:1px solid #f0f2f5;border-radius:10px;margin-bottom:8px">
        <div style="font-weight:800;font-size:16px;margin-bottom:4px">${esc(v.prefixo)} · ${esc(v.modelo)}</div>
        <div style="font-size:12px;color:#6b7683;margin-bottom:8px">Placa: <b class="num">${esc(v.placa)}</b></div>
        <div class="list-row" style="padding:0;border:none;margin-bottom:6px"><span>Motorista</span><span>${esc(mot)}</span></div>
        <div class="list-row" style="padding:0;border:none;margin-bottom:6px"><span>Situação</span>${sitChip(v.situacao)}</div>
        <div class="list-row" style="padding:0;border:none"><span>Documentação</span><span>${esc(v.documentacao||"OK")}</span></div>
        ${pEnv ? `<div style="margin-top:6px;color:#b52d2d;font-size:12px;font-weight:700">⚠️ ${pEnv} penalidades</div>` : ""}
      </div>`;
    }).join("")
    : `<div class="table-empty">Nenhum veículo vinculado.</div>`;

  function paintCobs(){
    let rows = [...minhasCobs].sort((a,b) => (a.situacao===b.situacao?0:a.situacao==="Aberto"?-1:1) || (a.vencimento||"").localeCompare(b.vencimento||""));
    if(FILT==="open") rows = rows.filter(c=>c.situacao==="Aberto");
    if(FILT==="paid") rows = rows.filter(c=>c.situacao==="Quitado");

    $("#cobrancas").innerHTML = rows.length
      ? `<table class="table"><thead><tr><th>Tipo</th><th>Ref.</th><th>Venc.</th><th class="right">Valor</th><th>Status</th></tr></thead><tbody>` +
        rows.map(c => {
          const venc = (c.vencimento||"").split("-").reverse().join("/");
          const atras = c.situacao==="Aberto" && c.vencimento && c.vencimento < T.today();
          const chip = c.situacao==="Quitado" 
            ? '<span class="chip go"><i></i>Quitado</span>'
            : atras ? '<span class="chip stop"><i></i>Vencida</span>'
            : '<span class="chip warn"><i></i>Em aberto</span>';
          return `<tr><td>${esc(c.tipo)}</td><td class="muted" style="font-size:12px">${esc(c.referencia)}</td>
            <td class="num">${venc}</td><td class="right num" style="font-weight:700;color:${c.situacao==="Quitado"?"var(--go)":"#111a27"}">${money(c.valor)}</td>
            <td>${chip}</td></tr>`;
        }).join("") +
        `</tbody></table>`
      : `<div class="table-empty">Nenhuma cobrança para você.</div>`;
  }
  paintCobs();
});
</script>
</body>
</html>
