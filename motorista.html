<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101826">
<link rel="manifest" href="manifest.json">
<title>Motorista · Cooperativa</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <div><div class="eyebrow">Meu painel</div><h1>Motorista</h1></div>
  </div>

  <div id="alertas"></div>

  <div class="grid g-2 mb" id="kpis"></div>

  <div class="grid" style="gap:16px">
    <div class="card">
      <div class="card-h"><h3>Meu veículo</h3></div>
      <div class="card-b" id="veiculo"></div>
    </div>

    <div class="card">
      <div class="card-h"><h3>Fila de hoje</h3></div>
      <div class="card-b" id="fila"></div>
    </div>
  </div>

  <div class="card mt">
    <div class="card-h"><h3>Minha agenda</h3></div>
    <div class="card-b" id="agenda"></div>
  </div>

  <div class="card mt">
    <div class="card-h"><h3>Penalidades</h3></div>
    <div class="card-b" id="penalidades"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
<script>
boot("motorista.html", async ()=>{
  requireLogin();
  const user = getUser();
  if(user.tipo !== "Motorista") { toast("Acesso apenas para motoristas","stop"); logout(); return; }

  const [veics, pens] = await Promise.all([DB.all("veiculos"), DB.all("penalidades")]);
  
  // Encontra o veículo deste motorista
  const veic = veics.find(v => v.motoristaId === user.id);
  if(!veic) {
    $("#veiculo").innerHTML = `<div class="table-empty">Nenhum veículo vinculado a você.</div>`;
    return toast("Nenhum veículo encontrado","stop");
  }

  const prop = (await DB.all("pessoas")).find(p => p.id === veic.proprietarioId);
  
  // Alerta de documentação vencida
  if(veic.documentacao && veic.documentacao.toLowerCase().includes("vencida")) {
    $("#alertas").innerHTML = `<div class="banner">⚠️ Sua documentação está <b>vencida</b>. 
      Você não pode rodar até regularizar!</div>`;
  }

  // KPIs
  const diasLabel = COOP.DIAS.map((d,i) => (veic.escalaDias||[]).includes(i) ? d : null).filter(x=>x).join(" · ");
  const penalties = pens.filter(p => p.veiculoId === veic.id);
  const kpi = (k,v,sub) => `<div class="card stat"><div class="k">${k}</div><div class="v small">${v}</div><div class="sub">${sub||""}</div></div>`;
  $("#kpis").innerHTML = kpi("Penalidades em aberto", String(penalties.length), "este mês") + kpi("Documentação", veic.documentacao || "OK", "");

  // Veículo
  $("#veiculo").innerHTML = `
    <div class="list-row"><span>Prefixo</span><b>${esc(veic.prefixo)}</b></div>
    <div class="list-row"><span>Placa</span><b class="num">${esc(veic.placa)}</b></div>
    <div class="list-row"><span>Modelo</span><span>${esc(veic.modelo)} · ${esc(veic.marca)}</span></div>
    <div class="list-row"><span>Capacidade</span><b>${veic.capacidade} pass.</b></div>
    <div class="list-row"><span>Proprietário</span><span>${esc(prop?.nome || "—")}</span></div>
    <div class="list-row"><span>Situação</span>${sitChip(veic.situacao)}</div>`;

  // Fila de hoje
  const date = T.today();
  const fila = (await FILA.get(date)).sort((a,b) => a.ordem - b.ordem);
  const meuLugar = fila.find(f => f.veiculoId === veic.id);
  
  if(!meuLugar) {
    $("#fila").innerHTML = `<div class="table-empty">Você não está escalado para hoje.</div>`;
  } else {
    const nowM = T.now();
    const atrasado = meuLugar.status === "aguardando" && T.toMin(meuLugar.previsto) < nowM - COOP.TOLERANCIA_MIN;
    let statusClass = "go", statusTxt = "No horário";
    if(meuLugar.status === "saiu") { statusClass = "brand"; statusTxt = "Saiu às "+meuLugar.real; }
    else if(atrasado) { statusClass = "stop"; statusTxt = "Atrasado"; }
    $("#fila").innerHTML = `
      <div class="list-row"><span>Sua posição</span><b style="font-size:24px">#${meuLugar.ordem}</b></div>
      <div class="list-row"><span>Horário previsto</span><b class="num">${meuLugar.previsto}</b></div>
      <div class="list-row"><span>Status</span><span class="chip ${statusClass}"><i></i>${statusTxt}</span></div>
      ${meuLugar.real ? `<div class="list-row"><span>Saída real</span><b class="num">${meuLugar.real}</b></div>` : ""}`;
  }

  // Agenda
  const dias = (veic.escalaDias || []).map(d => COOP.DIAS[d]).join(", ");
  $("#agenda").innerHTML = `
    <div style="padding:16px;text-align:center">
      <div style="font-size:13px;color:#6b7683;margin-bottom:8px">VOCÊ RODA</div>
      <div style="font-size:18px;font-weight:800;color:#2a3f86">${dias || "—"}</div>
      <div style="font-size:13px;color:#6b7683;margin-top:8px">1ª saída: ${COOP.PRIMEIRA_SAIDA}</div>
    </div>`;

  // Penalidades
  $("#penalidades").innerHTML = penalties.length 
    ? `<table class="table"><thead><tr><th>Data</th><th>Motivo</th><th>Posições</th></tr></thead><tbody>` +
      penalties.map(p => `<tr><td>${(p.data||"").split("-").reverse().join("/")}</td>
        <td>${esc(p.motivo||"—")}</td><td class="num">${p.posicoes}</td></tr>`).join("") +
      `</tbody></table>`
    : `<div class="table-empty">Nenhuma penalidade registrada.</div>`;
});
</script>
</body>
</html>
